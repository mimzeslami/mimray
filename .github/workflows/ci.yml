name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Linux TUN end-to-end (Docker)
        run: ./tool/linux_tun_test.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04] # 22.04 = older glibc, runs on newer distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: ./tool/release.sh
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-${{ matrix.os }}', path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "mimray $GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
