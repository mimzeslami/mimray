name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache-dependency-path: helper/go.sum }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Helper unit tests
        run: cd helper && go vet ./... && go test ./...
      - name: Linux TUN end-to-end (Docker)
        run: ./tool/linux_tun_test.sh
      - name: Linux helper end-to-end (Docker, real root)
        run: ./tool/linux_helper_test.sh

  windows-e2e:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - run: flutter pub get
      - run: ./tool/fetch_core.sh
      - name: Windows TUN end-to-end (real UAC launcher + local proxy)
        run: MIMRAY_CORE="$(cygpath -w "$PWD/windows/core/sing-box.exe")" dart run tool/win_e2e.dart

  build:
    needs: [test, windows-e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest] # 22.04 = older glibc, runs on newer distros
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env:
      # macOS signing + notarization switch on automatically once these secrets exist
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache-dependency-path: helper/go.sum }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KP" build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - run: ./tool/release.sh
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-${{ matrix.os }}', path: dist/* }

  android:
    needs: test
    runs-on: ubuntu-22.04
    env:
      # release signing switches on once these secrets exist (else debug-signed)
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - name: Cache libbox (keyed on the pinned build script)
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ hashFiles('tool/build_libbox.sh') }}
      - run: '[ -f android/app/libs/libbox.aar ] || ./tool/build_libbox.sh'
      - name: Release keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: TARGET=android ./tool/release.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist-android, path: dist/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "mimray $GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
